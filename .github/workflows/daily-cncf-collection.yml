name: CNCF Upstream Daily Collection

on:
  # 毎日UTC 0:00（日本時間 9:00）に実行
  schedule:
    - cron: '0 0 * * *'

  # 手動実行を許可
  workflow_dispatch:

  # PRでのテスト用（オプション）
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/daily-cncf-collection.yml'

# GitHub Pagesへのデプロイに必要な権限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全履歴を取得

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd scripts
          pip install -r requirements.txt

      - name: Run CNCF upstream collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/run_daily_collection.sh
          cd scripts
          bash run_daily_collection.sh

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: collect-and-publish
    runs-on: ubuntu-latest

    # PRの場合はデプロイをスキップ
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
