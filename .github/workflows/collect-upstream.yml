name: Collect CNCF Upstream Data

on:
  # Run daily at 9:00 AM JST (00:00 UTC)
  # Note: First scheduled run may be delayed by GitHub
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install collector dependencies
        run: |
          cd scripts/collector
          npm install

      - name: Run upstream collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts/collector
          node index.js

      - name: Check for changes
        id: git-check
        run: |
          git add src/content/posts/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: Daily CNCF upstream collection $(date +'%Y-%m-%d')

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push

      - name: Build and deploy site
        if: steps.git-check.outputs.changes == 'true'
        run: |
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        if: steps.git-check.outputs.changes == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: upstreamlens.io
